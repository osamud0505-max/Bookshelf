<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#131318">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Shelf</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg?i=2" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png?i=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=IM+Fell+English:ital@0;1&family=Pirata+One&family=Bebas+Neue&family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Caveat:wght@500;700&family=Cinzel:wght@400;600;800&family=Cormorant+Garamond:wght@500;600;700&family=Courier+Prime:wght@400;700&family=DM+Serif+Display&family=Inter+Tight:wght@400;500;600;800&family=Libre+Baskerville:wght@400;700&family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400&family=Oswald:wght@400;500;700&family=Playfair+Display:wght@400;600;800&family=Space+Grotesk:wght@400;500;700&display=swap">
<link rel="stylesheet" href="style.css?v=169">
</head>
<body>
<div id="backdrop" aria-hidden="true"></div>
<div class="page">
  <header class="header">
    <div>
      <h1 class="title">Shelf</h1>
      <p class="subtitle" id="stats"></p>
    </div>
    <div class="headerActions">
      <button class="iconBtn" id="soundBtn" aria-label="Room sound" hidden>
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path class="wave" d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/><path class="mute" d="M16 9.5l5 5M21 9.5l-5 5"/></svg>
      </button>
      <button class="iconBtn" id="musicBtn" aria-label="Music">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9.5"/><circle cx="12" cy="12" r="3"/><path d="M12 2.5a9.5 9.5 0 0 1 7 3.1M5 18.4A9.5 9.5 0 0 0 12 21.5"/></svg>
      </button>
      <button class="iconBtn" id="customizeBtn" aria-label="Customize">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="13.5" cy="6.5" r="1.5"/><circle cx="17.5" cy="10.5" r="1.5"/><circle cx="8.5" cy="7.5" r="1.5"/><circle cx="6.5" cy="12.5" r="1.5"/><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.93 0 1.65-.75 1.65-1.69 0-.44-.18-.84-.44-1.13-.29-.29-.44-.65-.44-1.13a1.64 1.64 0 0 1 1.67-1.67h2c3.05 0 5.56-2.5 5.56-5.55C22 6.04 17.5 2 12 2z"/></svg>
      </button>
      <button class="btn addTop" id="addShelfTopBtn">+ New shelf</button>
      <button class="btn primary addTop" id="addTopBtn">+ Add a book</button>
    </div>
  </header>

  <div class="searchBox">
    <svg class="searchIcon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="filter" class="input pill" type="search" placeholder="Find a book on your shelves" autocomplete="off">
  </div>

  <nav class="tabs" id="tabs" aria-label="Shelves"></nav>
  <main class="main" id="main"></main>
</div>

<button class="fab" id="fab" aria-label="Add a book">
  <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
</button>

<button class="fabShelf" id="fabShelf" aria-label="Add a new shelf">
  <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20h18M5 20V6h3v14M10 20V4h3v16M15.5 20l-1-12 3-.4 1.5 12.4"/></svg>
  <span>New shelf</span>
</button>

<!-- sheets -->
<div class="scrim" id="scrim" hidden></div>
<section class="sheet" id="bookSheet" hidden aria-modal="true" role="dialog" aria-label="Book"></section>
<section class="sheet" id="addSheet" hidden aria-modal="true" role="dialog" aria-label="Add a book"></section>
<section class="sheet" id="musicSheet" hidden aria-modal="true" role="dialog" aria-label="Music"></section>
<section class="sheet" id="customizeSheet" hidden aria-modal="true" role="dialog" aria-label="Customize"></section>
<div class="toast" id="toast" hidden></div>

<script src="decor.js?v=169"></script>
<script src="scenes.js?v=169"></script>
<script src="objects.js?v=169"></script>
<script src="closet.js?v=169"></script>
<script src="webs.js?v=169"></script>
<script src="cat.js?v=169"></script>
<script src="app.js?v=169"></script>
<script src="music.js?v=169"></script>
<script src="reader.js?v=169"></script>
<script src="ambience.js?v=169"></script>
</body>
</html>
